<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AdistributionSystem</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
	<header class="bar">
		<a class="mark" href="#/" aria-label="AdistributionSystem, home"><span class="mark-ad">Ad</span>istribution<em>System</em></a>
		<div class="crumb" id="crumb"></div>
		<div class="mode" id="mode" title="Whether model calls go to the Meta Model API"><span class="dot"></span><span id="mode-text">…</span></div>
	</header>

	<main id="home" class="home">
		<h1>Put your ad <em>in</em> the <em>moment</em></h1>
		<p class="lede">Drop a video and an ad. We find the moment and write the way in.</p>

		<form class="composer" id="composer" autocomplete="off">
			<div class="slots">
				<label class="slot" data-kind="video">
					<input type="file" accept="video/*" hidden>
					<span class="slot-empty"><span class="slot-plus">+</span><span><b>Video</b><small>Drop or choose</small></span></span>
					<span class="slot-full"><img alt=""><span><b class="slot-name"></b><small class="slot-dur"></small></span><button type="button" class="slot-x" aria-label="Remove">×</button></span>
				</label>
				<label class="slot" data-kind="ad">
					<input type="file" accept="video/*" hidden>
					<span class="slot-empty"><span class="slot-plus">+</span><span><b>Ad</b><small>Drop or choose</small></span></span>
					<span class="slot-full"><img alt=""><span><b class="slot-name"></b><small class="slot-dur"></small></span><button type="button" class="slot-x" aria-label="Remove">×</button></span>
				</label>
			</div>
			<input class="ask" id="ask" type="text" placeholder="Ask anything about your ad" aria-label="Your request">
			<div class="composer-foot">
				<span class="hint" id="hint">Add a video and an ad</span>
				<button class="send" id="send" type="submit" aria-label="Put my ad in this video" disabled>
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
				</button>
			</div>
		</form>
		<div class="tones" id="tones" role="radiogroup" aria-label="Tone">
			<button type="button" role="radio" data-tone="funny" aria-checked="true">Funny</button>
			<button type="button" role="radio" data-tone="cute" aria-checked="false">Cute</button>
			<button type="button" role="radio" data-tone="inner voice" aria-checked="false">Inner voice</button>
			<button type="button" role="radio" data-tone="sports replay" aria-checked="false">Sports replay</button>
			<button type="button" role="radio" data-tone="calm" aria-checked="false">Calm</button>
		</div>

		<section class="history" id="history" hidden>
			<h2>Recorded runs</h2>
			<ul id="history-list"></ul>
		</section>
	</main>

	<main id="studio" class="studio" hidden>
		<aside class="talk">
			<div class="bubble" id="you"></div>
			<div class="chips" id="chips"></div>
			<div class="says" id="says"></div>
			<ol class="plan" id="plan"></ol>
		</aside>

		<section class="stage">
			<div class="player">
				<video id="player" controls playsinline preload="metadata"></video>
				<div class="marker" id="marker" hidden><span id="marker-label"></span></div>
			</div>
			<div class="strip" id="strip"></div>
			<div class="cards" id="cards"></div>
		</section>

		<aside class="calls">
			<div class="calls-head">
				<h2>Meta model calls</h2>
				<span class="count" id="count">0</span>
			</div>
			<ol class="log" id="log"></ol>
			<div class="receipt" id="receipt">
				<div><span>Total</span><b id="total-cost">$0.0000</b></div>
				<div class="receipt-sub" id="total-sub">No call yet</div>
			</div>
		</aside>
	</main>

	<script src="/app.js?v=4"></script>
</body>
</html>
